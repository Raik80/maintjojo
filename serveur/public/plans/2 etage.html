<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Interactif</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0f1117; color: #e2e8f0;
  height: 100vh; display: flex; flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
.header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px; background: #1a1d2e;
  border-bottom: 1px solid #2d3148;
}
.header h1 {
  font-size: 18px; font-weight: 700;
  background: linear-gradient(135deg, #22c55e, #38bdf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

/* ── LAYOUT ── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── LISTE GAUCHE ── */
.sidebar {
  width: 220px; background: #1a1d2e; padding: 12px;
  border-right: 1px solid #2d3148; overflow-y: auto;
}
.sidebar h2 { font-size: 13px; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
.room-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; margin-bottom: 4px; border-radius: 6px;
  cursor: pointer; transition: background 0.15s;
  font-size: 13px;
}
.room-chip:hover { background: #2d3148; }
.room-chip.active { background: #22c55e22; border: 1px solid #22c55e; }
.room-chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── PLAN ZONE ── */
.plan-zone {
  flex: 1; position: relative; overflow: hidden;
  background: #0f1117; cursor: grab;
}
.plan-zone:active { cursor: grabbing; }
#svgWrapper {
  position: absolute; top: 0; left: 0;
  transform-origin: 0 0;
}
#svgWrapper svg { display: block; overflow: visible; background: transparent !important; }

/* Desactiver les clics sur tout le plan */
#svgWrapper svg * { pointer-events: none !important; }

/* Reactiver les clics uniquement sur les pieces */
#svgWrapper svg .piece-zone {
  display: inline !important;
  cursor: pointer !important;
  pointer-events: all !important;
  transition: all 0.15s ease;
}

/* Cacher le rectangle de fond gris genere par ezdxf */
#rect12 { display: none !important; }

/* ── TOOLBAR ── */
.toolbar {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; background: #1a1d2ecc; padding: 6px 12px;
  border-radius: 20px; backdrop-filter: blur(8px); border: 1px solid #2d3148;
}
.toolbar button {
  background: #2d3148; border: none; color: #e2e8f0;
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
}
.toolbar button:hover { background: #3d4168; }
#zoomLabel { color: #94a3b8; font-size: 12px; display: flex; align-items: center; padding: 0 8px; }

/* ── PANEL DROIT ── */
.side-panel {
  width: 0; overflow: hidden; background: #1a1d2e;
  border-left: 1px solid #2d3148; transition: width 0.25s ease;
}
.side-panel.open { width: 280px; }
.side-panel-inner {
  width: 280px; padding: 20px;
}
.side-panel h2 { font-size: 18px; margin-bottom: 16px; color: #22c55e; }
.side-panel .info-row { margin-bottom: 10px; font-size: 13px; color: #94a3b8; }
.side-panel .info-row span { color: #e2e8f0; }

/* ── HINT ── */
.hint {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: #4a5568; font-size: 14px; pointer-events: none;
}
</style>
</head>

const SVG_PX_W = 2000;
const SVG_PX_H = 980;

const planZone = document.getElementById('planZone');
const wrapper  = document.getElementById('svgWrapper');
const svgEl    = wrapper.querySelector('svg');
let scale = 1, tx = 0, ty = 0;
let selectedIdx = -1;

// ── Mapping: svgId -> room index (pour gerer les groupes) ──
const ID_TO_ROOM = {};
ROOMS.forEach((room, idx) => {
  // Chaque room a svgElementIds (liste) ou svgElementId (ancien format)
  const ids = room.svgElementIds || [room.svgElementId];
  ids.forEach(sid => { ID_TO_ROOM[sid] = idx; });
});

// ── LISTE DES PIECES ──
const listEl = document.getElementById('roomList');
ROOMS.forEach((room, idx) => {
  const chip = document.createElement('div');
  chip.className = 'room-chip';
  chip.id = 'chip-' + idx;
  chip.innerHTML = '<div class="dot" style="background:#22c55e"></div>' + room.name;
  chip.addEventListener('click', () => selectRoom(idx));
  listEl.appendChild(chip);
});

// Helper: recuperer tous les IDs SVG d'une room
function getRoomSvgIds(room) {
  return room.svgElementIds || [room.svgElementId];
}

// Helper: colorier ou decolorier tous les elements d'une room
function setRoomStyle(roomIdx, fill, stroke) {
  const room = ROOMS[roomIdx];
  getRoomSvgIds(room).forEach(sid => {
    const el = document.getElementById(sid);
    if (el) {
      el.style.fill = fill;
      el.style.stroke = stroke;
    }
  });
}

// ── INIT SVG ──
let found = 0;
ROOMS.forEach((room, roomIdx) => {
  const ids = getRoomSvgIds(room);
  ids.forEach(sid => {
    const el = document.getElementById(sid);
    if (!el) {
      console.warn('[MANQUANT]', sid);
      return;
    }
    found++;
    console.log('[OK]', sid, el.tagName);

    // Init piece (quasi-transparente pour capter les clics)
    el.style.fill = 'rgba(0,0,0,0.01)';
    el.style.stroke = 'rgba(0,0,0,0.01)';
    el.setAttribute('stroke-width', '2500');
    el.classList.add('piece-zone');

    // mousedown = plus fiable que click sur SVG
    el.addEventListener('mousedown', e => {
      e.stopPropagation();
      selectRoom(roomIdx);
    });

    el.addEventListener('mouseenter', () => {
      if (selectedIdx !== roomIdx) {
        // Vert leger au survol — colore TOUT le groupe
        setRoomStyle(roomIdx, '#22c55e22', '#22c55e88');
      }
    });
    el.addEventListener('mouseleave', () => {
      if (selectedIdx !== roomIdx) {
        setRoomStyle(roomIdx, 'rgba(0,0,0,0.01)', 'rgba(0,0,0,0.01)');
      }
    });
  });
});
console.log('[INIT]', found, 'elements SVG trouves');

// ── SELECTION ──
function selectRoom(roomIdx) {
  // Decolorier l'ancien
  if (selectedIdx >= 0) {
    setRoomStyle(selectedIdx, 'rgba(0,0,0,0.01)', 'rgba(0,0,0,0.01)');
    document.querySelectorAll('.room-chip').forEach(c => c.classList.remove('active'));
  }

  selectedIdx = roomIdx;
  const room = ROOMS[roomIdx];

  // Colorier en vert TOUT le groupe
  setRoomStyle(roomIdx, '#22c55e44', '#22c55e');
  getRoomSvgIds(room).forEach(sid => {
    const el = document.getElementById(sid);
    if (el) el.setAttribute('stroke-width', '3500');
  });

  const chip = document.getElementById('chip-' + roomIdx);
  if (chip) chip.classList.add('active');

  document.getElementById('panelTitle').textContent = room.name;
  document.getElementById('panelType').textContent = room.type;
  document.getElementById('panelArea').textContent = room.area || 'Non defini';
  document.getElementById('panelId').textContent = getRoomSvgIds(room).join(', ');
  document.getElementById('sidePanel').classList.add('open');
  document.getElementById('hint').style.opacity = '0';
}

function deselectRoom() {
  if (selectedIdx < 0) return;
  setRoomStyle(selectedIdx, 'rgba(0,0,0,0.01)', 'rgba(0,0,0,0.01)');
  document.querySelectorAll('.room-chip').forEach(c => c.classList.remove('active'));
  selectedIdx = -1;
  document.getElementById('sidePanel').classList.remove('open');
  document.getElementById('hint').style.opacity = '1';
}

// ── ZOOM & PAN ──
function resetView() {
  const pw = planZone.clientWidth, ph = planZone.clientHeight;
  const sx = pw / SVG_PX_W, sy = ph / SVG_PX_H;
  scale = Math.min(sx, sy) * 0.9;
  tx = (pw - SVG_PX_W * scale) / 2;
  ty = (ph - SVG_PX_H * scale) / 2;
  applyTransform(true);
}

function applyTransform(animate) {
  wrapper.style.transition = animate ? 'transform 0.25s cubic-bezier(0.4,0,0.2,1)' : 'none';
  wrapper.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
}

planZone.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = planZone.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const f = e.deltaY < 0 ? 1.15 : 0.87;
  const ns = Math.max(0.1, Math.min(20, scale * f));
  const sf = ns / scale;
  tx = cx - sf * (cx - tx);
  ty = cy - sf * (cy - ty);
  scale = ns;
  applyTransform(false);
}, {passive: false});

let dragging = false, dragX, dragY;
planZone.addEventListener('mousedown', e => {
  dragging = true; dragX = e.clientX - tx; dragY = e.clientY - ty;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = e.clientX - dragX; ty = e.clientY - dragY;
  applyTransform(false);
});
window.addEventListener('mouseup', () => { dragging = false; });

document.getElementById('btnZoomIn').addEventListener('click', () => {
  scale = Math.min(20, scale * 1.3);
  applyTransform(true);
});
document.getElementById('btnZoomOut').addEventListener('click', () => {
  scale = Math.max(0.1, scale * 0.7);
  applyTransform(true);
});
document.getElementById('btnReset').addEventListener('click', resetView);

planZone.addEventListener('dblclick', deselectRoom);

resetView();
</script>
